<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Local Full-Stack Site</title>
    <style>
        body {
            background-color: #0f172a;
            color: #38bdf8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 2.5rem; margin-bottom: 2rem; }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #7dd3fc; }
        #quote-display {
            margin-top: 2rem;
            font-style: italic;
            color: #94a3b8;
            max-width: 500px;
            font-size: 1.2rem;
            min-height: 50px;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Local Full-Stack App</h1>
    <button id="quote-btn">Fetch Secret Backend Quote</button>
    <p id="quote-display">Click the button to communicate with the server backend...</p>

    <script>
        document.getElementById('quote-btn').addEventListener('click', async () => {
            const display = document.getElementById('quote-display');
            display.innerText = "Connecting to backend server...";

            try {
                const response = await fetch('/.netlify/functions/get-quote');
                const data = await response.json();
                display.innerText = data.quote;
            } catch (error) {
                display.innerText = "Error connecting to the backend server.";
                console.error(error);
            }
        });
    </script>
</body>
</html>
